services:
  mongo:
    image: mongo:6
    container_name: chembank-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  fastapi:
    build: .
    container_name: chembank-api
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - ./uploads:/app/uploads
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - ENVIRONMENT=production  # Add this line
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --forwarded-allow-ips "*"
volumes:
  mongo-data: {}
