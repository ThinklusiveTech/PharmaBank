version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: chembank-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  fastapi:
    build: .
    container_name: chembank-api
    ports:
      - "8000:8000"
    depends_on:
      - mongo

volumes:
  mongo-data:
